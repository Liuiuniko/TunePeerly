[package]
name = "device-music"
version = "0.1.0"
description = "Multi-Device Music Player"
authors = ["CodeWithZhe"]
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "device_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
lofty = "0.22"
blake3 = "1"
mdns-sd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rcgen = "0.13"
x509-parser = { version = "0.16", features = ["verify"] }
sha2 = "0.10"
data-encoding = "2"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.9"
thiserror = "2"
rand = "0.9"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
whoami = "1"
if-addrs = "0.14"
async-trait = "0.1"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", package = "libsignal-protocol" }
rustls-pki-types = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
